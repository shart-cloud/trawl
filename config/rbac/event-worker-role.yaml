# Least-privilege identity for the event worker.
#
# In US2 it only reads. The CaptureJob create and CapturePolicy status grants
# arrive with US4; they are not granted ahead of the code that uses them,
# because an unused permission is attack surface with no benefit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trawl-event-worker
  namespace: trawl-system
  labels:
    app.kubernetes.io/name: trawl
    app.kubernetes.io/component: event-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trawl-event-worker
  namespace: trawl-system
rules:
  # Leader election. Scoped to the worker's own lease by name so a compromised
  # worker cannot disrupt the controller manager's election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
    resourceNames: ["trawl-event-worker"]
  # Creating the lease requires an unnamed create, since the name cannot be
  # checked before the object exists.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  # Resolving which tap a flow belongs to.
  - apiGroups: ["trawl.cloud"]
    resources: ["networktaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trawl-event-worker
  namespace: trawl-system
subjects:
  - kind: ServiceAccount
    name: trawl-event-worker
    namespace: trawl-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trawl-event-worker
