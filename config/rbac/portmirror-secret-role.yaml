# PortMirror resolves device credentials only in Trawl's system namespace.
# Keep that permission out of the manager ClusterRole: a cluster-wide Secret
# get grant would let the manager read credentials in namespaces it never
# reconciles. Dynamic deviceRef names prevent resourceNames from narrowing the
# rule further, so this get-only namespaced Role is the smallest practical
# grant. The uncached API reader is what keeps list and watch absent.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portmirror-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portmirror-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portmirror-secret-reader
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: system
