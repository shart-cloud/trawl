apiVersion: v1
kind: Namespace
metadata:
  name: trawl-system
  labels:
    app.kubernetes.io/name: trawl
    app.kubernetes.io/managed-by: kustomize
    # Trawl's control plane runs unprivileged and must keep doing so. Enforcing
    # restricted here means a control-plane pod that acquires a capability or a
    # host namespace is rejected at admission rather than discovered later.
    #
    # Capture and analyzer pods need CAP_NET_RAW and are created by the operator
    # with an explicit exception; they are the only workloads that get one.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
