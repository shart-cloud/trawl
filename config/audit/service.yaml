# The internal audit sink.
#
# Admission, the reconcilers, the event worker, and the artifact gateway commit
# audit records here over mTLS rather than writing to the ledger directly. Only
# the controller manager holds ledger credentials, so a compromised gateway or
# worker cannot write arbitrary history (ADR-0003).
apiVersion: v1
kind: Service
metadata:
  # config/default prepends "trawl-" and sets the namespace, so this renders
  # as trawl-audit in trawl-system -- the name internal/audit's client dials.
  name: audit
  namespace: system
  labels:
    app.kubernetes.io/name: trawl
    app.kubernetes.io/component: audit-sink
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trawl
    app.kubernetes.io/component: controller-manager
  ports:
    # The pod serves on 9444 (config/manager/manager.yaml, containerPort
      # "audit"). Clients dial the Service on 8443.
    - name: audit
      port: 8443
      targetPort: audit
      protocol: TCP
