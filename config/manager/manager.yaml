apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: trawl
    app.kubernetes.io/managed-by: kustomize
    # Sensors observe a host interface, so they need hostNetwork and NET_RAW /
    # NET_ADMIN. That is the workload's whole purpose, not a shortcut: a tap
    # that cannot open a raw socket cannot see a packet. FR-001 confines those
    # privileged workloads to this namespace precisely because they cannot be
    # made unprivileged.
    #
    # Without this the namespace inherits the cluster's default, and every
    # sensor pod is refused - "violates PodSecurity baseline:latest" - while the
    # DaemonSet, the tap and the controller all report success. The tap sits in
    # Pending with no packets and nothing says why.
    #
    # audit stays at restricted so the control-plane workloads, which are
    # restricted-compatible, still have any regression recorded.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: trawl
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: trawl
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: trawl
        # The webhook Service selects on this label (config/webhook/service.yaml),
        # and it is the convention the sensor pods and the Alloy discovery rules
        # already use. Without it the Service has no endpoints, every admission
        # call fails, and no NetworkTap can be created at all - the manager runs
        # and the API is still closed.
        app.kubernetes.io/component: controller-manager
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The image installs the binary at /trawl and declares it as ENTRYPOINT
        # (see Dockerfile). The scaffold's /manager was never renamed to match,
        # so the container exited 128 at create time - "stat /manager: no such
        # file or directory" - before any of its own code ran.
      - command:
        - /trawl
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        # A digest rather than a tag on purpose: a floating tag here would ship
        # in release manifests, which the constitution forbids, and would let
        # the deployed image change without a manifest change. Refresh it with
        # the digest CI records for the commit being deployed.
        image: ghcr.io/shart-cloud/trawl/controller-manager@sha256:d9f4cedfca6c8f0acc50b7dd7ff553b30bed6e2a22125cef20473e9d3e34e7de
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        # The manager reads its installation configuration from
        # /etc/trawl/config.yaml (cmd/controller-manager/main.go). Without this
        # mount it starts, fails to read the file, and exits - so the mount is
        # not optional, and an empty list here meant the deployment could never
        # have run.
        volumeMounts:
          - name: config
            mountPath: /etc/trawl
            readOnly: true
          # storage.NewS3Store reads accessKeyID and secretAccessKey as files
          # from the credentialsPath directories in that configuration, so
          # these mounts are what let the manager reach object storage at all.
          # They deliberately sit outside /etc/trawl rather than nested inside
          # the ConfigMap mount: a volume mounted under another volume's mount
          # point depends on kubelet ordering, and a credential is a poor place
          # to rely on that.
          - name: audit-credentials
            mountPath: /var/run/secrets/trawl/audit
            readOnly: true
          # Declared by the installation configuration and provisioned by
          # hack/dev-storage.sh. Nothing constructs the artifact store until
          # US3 adds capture, so this mount is present for the credential
          # separation ADR-0003 requires, not because it is read yet.
          - name: artifact-credentials
            mountPath: /var/run/secrets/trawl/artifacts
            readOnly: true
      volumes:
        - name: config
          configMap:
            name: trawl-config
        # Two secrets, not one. The credential that writes evidence must not be
        # able to rewrite the record of how that evidence was handled.
        - name: audit-credentials
          secret:
            secretName: trawl-audit-ledger
        - name: artifact-credentials
          secret:
            secretName: trawl-artifact-storage
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
