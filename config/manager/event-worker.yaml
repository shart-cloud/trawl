# trawl-event-worker.
#
# Separate from the controller manager so its failure cannot stop tap
# reconciliation. Consuming a live gRPC stream has a different availability
# profile from reconciling declarative state, and the constitution requires one
# component's failure not to take out independent monitoring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-worker
  namespace: trawl-system
  labels:
    app.kubernetes.io/name: trawl
    app.kubernetes.io/component: event-worker
spec:
  # One replica. Leader election is still what guarantees a single consumer -
  # from US4 onward two consumers would create duplicate captures for one event,
  # so the election is not optional - but a standby replica cannot be run here.
  # Readiness requires a connected flow stream, and only the leader connects, so
  # a second pod would sit unready forever and hold the Deployment at
  # Available=False.
  replicas: 1
  # Recreate, for the same reason. Under RollingUpdate the incoming pod waits
  # for readiness it cannot reach until it holds the lease, and the outgoing
  # leader is not removed until the incoming pod is ready: the rollout deadlocks
  # and the worker keeps serving from its old image. Terminating first releases
  # the lease and costs a short, visible gap in cluster-flow collection.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trawl
      app.kubernetes.io/component: event-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trawl
        app.kubernetes.io/component: event-worker
    spec:
      serviceAccountName: event-worker
      # Restricted-compatible: this workload never touches the packet path, so
      # it needs no capability, no host namespace, and no writable root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # Group-owns the mounted secret so the 0440 Hubble key is readable by
        # this process and by nothing else.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: event-worker
          # Placeholder digest, substituted by the release overlay. A tag here
          # would let the deployed image change without a manifest change.
          image: ghcr.io/shart-cloud/trawl/event-worker@sha256:27ce412ddf261dc90383472acdea64ee8f9a9166a9fc9fe38a898e716a8cdbce
          args:
            - --config=/etc/trawl/config.yaml
            - --leader-elect=true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TRAWL_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: probes
              containerPort: 9110
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            # Readiness follows the flow stream. A worker reporting ready while
            # disconnected would hide that denied-flow evidence is not being
            # collected.
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/trawl
              readOnly: true
            - name: hubble-tls
              mountPath: /etc/hubble
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: trawl-config
        - name: hubble-tls
          secret:
            # Hubble Relay serves every connection in the cluster, so the client
            # certificate is what stops this from being an unauthenticated
            # cluster-wide traffic disclosure.
            secretName: trawl-hubble-client
            # 0440 with the fsGroup below, not 0400: secret files are owned by
            # root, so 0400 is readable only by root while this container runs
            # as 65532. The worker exited with "open /etc/hubble/tls.crt:
            # permission denied" before reaching Hubble at all. fsGroup makes
            # the volume group-owned by the runtime user, so group read is
            # enough and the key stays unreadable to everyone else.
            defaultMode: 0440
