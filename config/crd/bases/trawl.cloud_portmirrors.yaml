---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: portmirrors.trawl.cloud
spec:
  group: trawl.cloud
  names:
    kind: PortMirror
    listKind: PortMirrorList
    plural: portmirrors
    shortNames:
    - mirror
    - mirrors
    singular: portmirror
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.target
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastVerifiedTime
      name: Verified
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PortMirror configures traffic mirroring on a network device so a NetworkTap
          has something to observe.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PortMirrorSpec asks a network device to copy traffic from one or more ports
              to another.

              This is the only Trawl resource that writes to hardware outside the cluster,
              and it is deliberately its own kind rather than a NetworkTap source type.
              Three reasons, in order of how much they matter:

               1. **It is separately authorizable.** An analyst who may create taps and
                  request captures does not thereby gain the ability to reconfigure switch
                  hardware; granting `portmirrors` is its own decision. Device credentials
                  are coarse - RouterOS group policies do not offer "may only set a mirror"
                  - so the Kubernetes side is where least privilege is actually available,
                  and collapsing this into NetworkTap would give it away.

               2. **NetworkTap stays passive.** Nothing about the existing tap path
                  changes, and the resource that writes to the fabric is visibly a
                  different thing with a different blast radius.

               3. **The failure domains separate.** A device that refuses configuration
                  does not make a tap lie about what it is observing. The tap reports on
                  packets it can see; the mirror reports on what the device says.

              Mirroring copies traffic and leaves the forwarding path alone, so the
              observed traffic is not modified, blocked, delayed or redirected. What is new
              is that Trawl holds a credential that can change network hardware. See
              ADR-0007.
            properties:
              deviceRef:
                description: |-
                  DeviceRef names a Secret in the same namespace holding the device
                  address and credentials.

                  A Secret rather than inline fields, and in-namespace rather than
                  cluster-wide: the credential is the whole security story of this
                  resource, and a device address in a spec with the password somewhere
                  else invites the two to drift apart.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              direction:
                default: Both
                description: Direction selects which of the sources' traffic is copied.
                enum:
                - Both
                - Ingress
                - Egress
                type: string
              provider:
                description: Provider selects the driver used to talk to the device.
                enum:
                - MikroTikRouterOS7
                - MikroTikRouterOS7SSH
                type: string
              sources:
                description: Sources are the device ports whose traffic is copied.
                items:
                  maxLength: 64
                  pattern: ^[A-Za-z0-9._/-]+$
                  type: string
                maxItems: 48
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              target:
                description: |-
                  Target is the device port the copies are sent to.

                  It must not also be a source. A port mirroring itself is a loop the
                  switch will happily configure and nobody wants, so the union is checked
                  rather than documented.
                maxLength: 64
                pattern: ^[A-Za-z0-9._/-]+$
                type: string
            required:
            - deviceRef
            - provider
            - sources
            - target
            type: object
            x-kubernetes-validations:
            - message: target must not also be a source
              rule: '!(self.target in self.sources)'
          status:
            description: PortMirrorStatus is what the device reports, not what was
              asked for.
            properties:
              conditions:
                description: Conditions carry the detail behind Phase.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deviceIdentity:
                description: |-
                  DeviceIdentity is what the device said it is: model and firmware.

                  Kept because a mirror that works on one RouterOS release can fail on the
                  next, and an incident six months from now needs to know which it was.
                type: string
              lastVerifiedTime:
                description: LastVerifiedTime is when the device was last read back
                  successfully.
                format: date-time
                type: string
              observedDirections:
                additionalProperties:
                  description: MirrorDirection selects which of a source port's traffic
                    is copied.
                  enum:
                  - Both
                  - Ingress
                  - Egress
                  type: string
                description: |-
                  ObservedDirections reports each mirrored source port's actual direction.
                  A single aggregate Both would hide one ingress-only and one egress-only
                  port, so this map makes a direction-only drift visible.
                type: object
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
              observedSources:
                description: |-
                  ObservedSources and ObservedTarget are what the device says its mirror
                  is set to, read back after configuring.

                  Recorded separately from the spec so a drifted device is visible as a
                  difference rather than as a bare Degraded phase: an operator needs to
                  know what it drifted *to*, because that is usually somebody else's
                  change and the interesting question is whose.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              observedTarget:
                type: string
              phase:
                description: Phase is the mirror's operational position.
                enum:
                - Pending
                - Active
                - Degraded
                - Error
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
