apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The CRDs Trawl serves. Generated by `make manifests`; do not edit bases/.
resources:
  - bases/trawl.cloud_networktaps.yaml
  - bases/trawl.cloud_capturejobs.yaml

# The webhook needs a CA bundle injected into the CRD's conversion stanza only
# if conversion webhooks are in use. Every kind has one served version, so
# there is nothing to convert and no patch here.
