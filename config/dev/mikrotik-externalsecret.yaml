# ESO sync for the lab switch Trawl configures port mirroring on.
#
# Applied out of band like config/dev/trawl-config.yaml, and for the same
# reason: it names one installation's device, not something the operator
# manifests should assume exists. A PortMirror's deviceRef points at the
# Secret this produces.
#
# The Vault path must be allowed in the external-secrets policy first, or ESO
# gets a 403 and the ExternalSecret sits SecretSyncedError - the policy is an
# explicit allowlist, not a prefix grant.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trawl-mikrotik-crs328
  namespace: trawl-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: trawl-mikrotik-crs328
    template:
      type: Opaque
      data:
        # The key names the fabric provider reads. Kept flat and boring: a
        # device credential is not a place for a clever encoding.
        address: "{{ .address }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    # secretKey is what the fabric provider reads; property is the key as it
    # exists in Vault. They differ in case on purpose rather than by accident,
    # and renaming either side to match the other would mean editing something
    # somebody else owns.
    - secretKey: address
      remoteRef:
        key: mikrotik
        property: IP_ADDRESS
    - secretKey: username
      remoteRef:
        key: mikrotik
        property: USER
    - secretKey: password
      remoteRef:
        key: mikrotik
        property: PASSWORD
