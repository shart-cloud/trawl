# Installation configuration for a development cluster.
#
# This is the ConfigMap the controller manager and event worker both mount at
# /etc/trawl, and it is the file config.Validate checks before either will
# start. It is a worked example against a homelab cluster, not a release
# artifact: the image digests, the Loki endpoint and the storage endpoint are
# all specific to one installation.
#
# Every image reference is a digest. A tag would let the software running in a
# cluster change without any manifest changing, which is the property image
# pinning exists to prevent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trawl-config
  namespace: trawl-system
data:
  config.yaml: |
    # A Loki and metric label, so it has to stay low-cardinality.
    clusterID: homelab

    # The single namespace in which Trawl resources are accepted and privileged
    # workloads are created. Admission rejects Trawl resources anywhere else.
    systemNamespace: trawl-system

    loki:
      # The cluster's existing Loki. Trawl writes observations through Alloy and
      # reads them back for investigation; it does not own this store.
      endpoint: http://loki.monitoring.svc.cluster.local:3100

    hubble:
      # Port 443, not 80: enabling relay.tls.server in the Cilium values moves
      # the service off the plaintext port. The name is dialled over TLS, so a
      # stale :80 here fails as a connection refusal rather than as a silent
      # downgrade, but it fails.
      endpoint: hubble-relay.kube-system.svc.cluster.local:443
      # Mounted from the trawl-hubble-client secret, which cert-manager issues
      # from the Hubble CA (config/hubble/certificate.yaml). Relay requires a
      # client certificate, so these are what make cluster-flow observation
      # possible at all rather than an optional hardening step.
      caFile: /etc/hubble/ca.crt
      certFile: /etc/hubble/tls.crt
      keyFile: /etc/hubble/tls.key
      # Must match a SAN on the relay's serving certificate. The Cilium values
      # add this name explicitly; the chart's default certificate covers only
      # *.hubble-relay.cilium.io, which is not the name anything in the cluster
      # actually dials.
      serverName: hubble-relay.kube-system.svc.cluster.local

    # Two buckets, two credentials. The separation is the point: the credential
    # that can write evidence must not be able to rewrite the record of how that
    # evidence was handled (ADR-0003). Validation rejects a config where either
    # the buckets or the credential paths match.
    artifacts:
      endpoint: minio.trawl-system.svc.cluster.local:9000
      bucket: trawl-artifacts
      credentialsPath: /var/run/secrets/trawl/artifacts
      useTLS: false

    auditLedger:
      endpoint: minio.trawl-system.svc.cluster.local:9000
      bucket: trawl-audit-ledger
      credentialsPath: /var/run/secrets/trawl/audit
      useTLS: false

    # Must exceed captureRetentionCeiling: if audit records expired first, the
    # evidence would outlive its own provenance.
    auditRetention: 90d
    captureRetentionCeiling: 7d

    auditClientIdentities:
      - trawl-controller-manager.trawl-system.svc
      - trawl-event-worker.trawl-system.svc

    # Not a NetworkTap field on purpose: an under-provisioned sensor drops
    # observations silently, so it is not something a tap author can get wrong.
    sensorAgentResources:
      requestsCPU: 50m
      requestsMemory: 64Mi
      limitsCPU: 500m
      limitsMemory: 512Mi

    content:
      suricataFeedURL: https://rules.emergingthreats.net/open/suricata-8.0/emerging.rules.tar.gz
      zeekScriptRepo: https://github.com/zeek/packages
      refreshInterval: 24h

    images:
      suricata: ghcr.io/shart-cloud/trawl/suricata@sha256:99e3da1fa0dac03f1d70279cd0a25e8f1ee1b792551225d1f83f40bca413cb34
      zeek: ghcr.io/shart-cloud/trawl/zeek@sha256:34ece5b80a635ea20835b17b9b39aa87dd9288a9d36bc594ea081c66954143f1
      sensorAgent: ghcr.io/shart-cloud/trawl/sensor-agent@sha256:7a013ebd69d194f1d80c70f1684592a523ac7d2028a9fddd9a192d87a011c82e
      contentInit: ghcr.io/shart-cloud/trawl/content-init@sha256:4d6a17a7825c7ebe2d0ae54885f867456759b38f605fd698ee0d1670e472aa89
      # Not implemented until US3. The stub image exists so this required field
      # names something that resolves and refuses, rather than something that
      # resolves and does another component's job.
      captureRunner: ghcr.io/shart-cloud/trawl/capture-runner@sha256:b0f6cc2c73d847ca994e1fb5764a82336ea49cf7240c4e779205b9af177031bd
