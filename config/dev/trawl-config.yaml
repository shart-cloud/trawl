# Installation configuration for a development cluster.
#
# This is the ConfigMap the controller manager and event worker both mount at
# /etc/trawl, and it is the file config.Validate checks before either will
# start. It is a worked example against a homelab cluster, not a release
# artifact: the image digests, the Loki endpoint and the storage endpoint are
# all specific to one installation.
#
# Every image reference is a digest. A tag would let the software running in a
# cluster change without any manifest changing, which is the property image
# pinning exists to prevent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trawl-config
  namespace: trawl-system
data:
  config.yaml: |
    # A Loki and metric label, so it has to stay low-cardinality.
    clusterID: homelab

    # The single namespace in which Trawl resources are accepted and privileged
    # workloads are created. Admission rejects Trawl resources anywhere else.
    systemNamespace: trawl-system

    loki:
      # The cluster's existing Loki. Trawl writes observations through Alloy and
      # reads them back for investigation; it does not own this store.
      endpoint: http://loki.monitoring.svc.cluster.local:3100

    hubble:
      # Port 443, not 80: enabling relay.tls.server in the Cilium values moves
      # the service off the plaintext port. The name is dialled over TLS, so a
      # stale :80 here fails as a connection refusal rather than as a silent
      # downgrade, but it fails.
      endpoint: hubble-relay.kube-system.svc.cluster.local:443
      # Mounted from the trawl-hubble-client secret, which cert-manager issues
      # from the Hubble CA (config/hubble/certificate.yaml). Relay requires a
      # client certificate, so these are what make cluster-flow observation
      # possible at all rather than an optional hardening step.
      caFile: /etc/hubble/ca.crt
      certFile: /etc/hubble/tls.crt
      keyFile: /etc/hubble/tls.key
      # Must match a SAN on the relay's serving certificate. The Cilium values
      # add this name explicitly; the chart's default certificate covers only
      # *.hubble-relay.cilium.io, which is not the name anything in the cluster
      # actually dials.
      serverName: hubble-relay.kube-system.svc.cluster.local

    # Two buckets, two credentials. The separation is the point: the credential
    # that can write evidence must not be able to rewrite the record of how that
    # evidence was handled (ADR-0003). Validation rejects a config where either
    # the buckets or the credential paths match.
    artifacts:
      endpoint: minio.trawl-system.svc.cluster.local:9000
      bucket: trawl-artifacts
      credentialsPath: /var/run/secrets/trawl/artifacts
      useTLS: false

    auditLedger:
      endpoint: minio.trawl-system.svc.cluster.local:9000
      bucket: trawl-audit-ledger
      credentialsPath: /var/run/secrets/trawl/audit
      useTLS: false

    # Must exceed captureRetentionCeiling: if audit records expired first, the
    # evidence would outlive its own provenance.
    auditRetention: 90d
    captureRetentionCeiling: 7d

    # The mTLS common names permitted to commit audit records. Matched against
    # the client certificate the sink was presented, so each name here must be
    # the commonName of a Certificate in config/certmanager/certificate.yaml;
    # a mismatch is a 403 on every commit from that component, and FR-036 turns
    # that into the component refusing the action it could not record.
    auditClientIdentities:
      - trawl-controller-manager.trawl-system.svc
      - trawl-event-worker.trawl-system.svc
      - trawl-artifact-gateway.trawl-system.svc

    # The listener those clients reach, served by the controller manager
    # because it is the only holder of ledger credentials (ADR-0003). The files
    # are the audit-sink-cert Secret cert-manager issues from the Trawl CA and
    # config/manager/manager.yaml mounts; ca.crt in that Secret is the CA the
    # clients' own certificates are checked against.
    auditSink:
      listenAddr: ":9444"
      certFile: /var/run/secrets/trawl/audit-sink/tls.crt
      keyFile: /var/run/secrets/trawl/audit-sink/tls.key
      caFile: /var/run/secrets/trawl/audit-sink/ca.crt

    # The artifact gateway: the one component that hands packet data to a
    # person. Its serving certificate comes from artifact-gateway-tls, and its
    # client certificate from artifact-gateway-audit-client -- whose common name
    # must appear in auditClientIdentities above, or every download is refused
    # because it cannot be recorded (FR-036).
    gateway:
      listenAddr: ":8443"
      # Download tokens must be minted for this audience. Deliberately not the
      # API server's: a default service-account token would otherwise be
      # replayable here from any pod in the cluster.
      tokenAudience: trawl-artifact-gateway
      # Per authenticated caller, not per address: every request arrives from
      # the same ingress, and the case worth bounding is one credential
      # sweeping every capture in the cluster.
      downloadsPerMinute: 30
      downloadBurst: 10
      # A ceiling on authentication attempts across all callers, valid or not.
      # The per-caller limit above cannot cover these: a rejected token has no
      # identity to key on, and every attempt is a TokenReview against the API
      # server.
      authAttemptsPerMinute: 600
      authAttemptBurst: 200
      certFile: /var/run/secrets/trawl/gateway-tls/tls.crt
      keyFile: /var/run/secrets/trawl/gateway-tls/tls.key
      auditClient:
        endpoint: https://trawl-audit.trawl-system.svc:8443
        serverName: trawl-audit.trawl-system.svc
        caFile: /var/run/secrets/trawl/audit-client/ca.crt
        certFile: /var/run/secrets/trawl/audit-client/tls.crt
        keyFile: /var/run/secrets/trawl/audit-client/tls.key

    # Not a NetworkTap field on purpose: an under-provisioned sensor drops
    # observations silently, so it is not something a tap author can get wrong.
    sensorAgentResources:
      requestsCPU: 50m
      requestsMemory: 64Mi
      limitsCPU: 500m
      limitsMemory: 512Mi

    capture:
      # Only this service account (in systemNamespace) may create Policy-typed
      # CaptureJobs. It must match config/manager/event-worker.yaml.
      eventWorkerServiceAccount: event-worker
      # Subjects allowed to change a CaptureJob's retention after creation.
      retentionAdminGroups:
        - trawl:retention-admins
      # Secret in systemNamespace holding the artifact-bucket credentials the
      # runner mounts. Created out of band; the operator never reads it.
      credentialsSecret: trawl-artifact-storage
      startupBudget: 5m
      uploadBudget: 15m
      runnerResources:
        requestsCPU: 100m
        requestsMemory: 128Mi
        limitsCPU: "1"
        limitsMemory: 1Gi
      reporterResources:
        requestsCPU: 10m
        requestsMemory: 32Mi
        limitsCPU: 100m
        limitsMemory: 128Mi

    content:
      suricataFeedURL: https://rules.emergingthreats.net/open/suricata-8.0/emerging.rules.tar.gz
      zeekScriptRepo: https://github.com/zeek/packages
      refreshInterval: 24h

    images:
      suricata: ghcr.io/shart-cloud/trawl/suricata@sha256:e3347bb5277eebb6714a3269c15f2eecbb93bb087bc4c83f1100cbe7d7216dd1
      zeek: ghcr.io/shart-cloud/trawl/zeek@sha256:9d8a89a046e1bb88ea579852f1dc05838ebaacf3edeb65fab37162d8f6c4a575
      sensorAgent: ghcr.io/shart-cloud/trawl/sensor-agent@sha256:07ffa54d44ac597ef282c3c4daa8f706a03414c9a197ffb92c2e90ebd0a3fe2a
      contentInit: ghcr.io/shart-cloud/trawl/content-init@sha256:c9556fdde44c276332e4baaeb0513e767b6c8fe0543e8e059cd37baa7f5175c6
      captureRunner: ghcr.io/shart-cloud/trawl/capture-runner@sha256:74426154c4e13cac12ee09fd38a86b86606f8c991c6aefcb4f0e3168cfa5f97b
      captureReporter: ghcr.io/shart-cloud/trawl/capture-reporter@sha256:1a0f1cfd31e3e9384b304863e667197436f271c2befa5d4ee75d86218dc54263
