# Egress allowlist for the event worker.
#
# It talks to exactly three things: DNS, the Kubernetes API for leader election
# and tap lookups, and Hubble Relay. Nothing else, and no ingress except probes
# and metrics scraping.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: event-worker
  namespace: trawl-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trawl
      app.kubernetes.io/component: event-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 9110
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Hubble Relay.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: hubble-relay
      ports:
        - port: 4245
          protocol: TCP
    # Kubernetes API. Expressed as a port rather than a peer because the
    # apiserver endpoint is not a labelled pod on Talos.
    #
    # The ipBlock this replaces excepted 10/8, 172.16/12 and 192.168/16, which
    # is where every in-cluster API server lives - leader election failed with
    # "dial tcp 10.96.0.1:443: i/o timeout" against the very address the rule
    # was meant to permit. Narrow this to the API server's address at install
    # time.
    - ports:
        - port: 6443
          protocol: TCP
        # In-cluster clients dial kubernetes.default.svc on 443.
        - port: 443
          protocol: TCP
