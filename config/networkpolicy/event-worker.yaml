# Egress allowlist for the event worker.
#
# It talks to exactly five things: DNS, the Kubernetes API for leader election
# and object access, Hubble Relay, Loki for the alert stream, and the audit sink
# on the controller manager. Nothing else, and no ingress except probes and
# metrics scraping.
#
# Every port below is a port on the receiving pod, not the port its Service
# publishes. Naming the Service port is what left the audit sink closed in
# Slice B0 while appearing to be allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: event-worker
  namespace: trawl-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trawl
      app.kubernetes.io/component: event-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 9110
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Hubble Relay.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: hubble-relay
      ports:
        - port: 4245
          protocol: TCP
    # Loki, for the Suricata alert stream. The worker reads alerts back out of
    # the observation pipeline rather than from the sensor, so without this rule
    # every poll times out and no signature ever triggers a capture - with the
    # policies still reporting themselves armed until the SourceConnected
    # condition catches up.
    #
    # Trawl does not own this store, so the namespace is where the installation
    # put it. Narrow the selector at install time if Loki lives elsewhere.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 3100
          protocol: TCP
    # The audit sink on the controller manager. 9444 is the manager's container
    # port; the trawl-audit Service publishes 8443 and forwards to it.
    #
    # The worker holds no ledger credentials of its own (ADR-0003), so this is
    # its only way to record that a policy asked for a capture. FR-036 makes an
    # unrecordable capture one it must not create, so closing this rule does not
    # degrade the worker - it stops it collecting anything at all.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trawl
              app.kubernetes.io/component: controller-manager
      ports:
        - port: 9444
          protocol: TCP
    # Kubernetes API. Expressed as a port rather than a peer because the
    # apiserver endpoint is not a labelled pod on Talos.
    #
    # The ipBlock this replaces excepted 10/8, 172.16/12 and 192.168/16, which
    # is where every in-cluster API server lives - leader election failed with
    # "dial tcp 10.96.0.1:443: i/o timeout" against the very address the rule
    # was meant to permit. Narrow this to the API server's address at install
    # time.
    - ports:
        - port: 6443
          protocol: TCP
        # In-cluster clients dial kubernetes.default.svc on 443.
        - port: 443
          protocol: TCP
