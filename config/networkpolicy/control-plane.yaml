# Default-deny plus an explicit allowlist for the control plane.
#
# The controller manager holds the audit-ledger and artifact credentials, so its
# reachable surface is the blast radius of a compromise. Everything it needs is
# named; everything else is refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: trawl-system
spec:
  # Applies to every pod in the namespace, including ones added later. A policy
  # that selected only known components would leave new workloads open.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-manager
  namespace: trawl-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trawl
      app.kubernetes.io/component: controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The API server calls the admission webhook. Its source address is not
    # expressible as a pod selector, so the port is opened rather than the peer.
    - ports:
        - port: 9443
          protocol: TCP
    # Metrics scraping.
    - ports:
        - port: 8443
          protocol: TCP
    # The audit sink, reachable only from Trawl's own components.
    #
    # 9444, not the 8443 the Service publishes: a NetworkPolicy port is the
    # port on the receiving pod, and the Service forwards 8443 to 9444. Naming
    # the Service port here opened the metrics port instead and left the sink
    # closed to the components that have no other way to record what they did.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trawl
      ports:
        - port: 9444
          protocol: TCP
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The Kubernetes API server. Expressed as a port rather than a peer because
    # the apiserver endpoint is not a labelled pod on most clusters, including
    # Talos.
    #
    # It previously carried an ipBlock excepting 10/8, 172.16/12 and
    # 192.168/16. Every in-cluster API server is reachable on one of those - a
    # ClusterIP in the service range, or the node address on a single-node
    # cluster - so the rule denied exactly the destination it existed to allow,
    # and the manager could not reach the API server at all. Narrow this to the
    # API server's address at install time, as with object storage below.
    - ports:
        - port: 6443
          protocol: TCP
        # In-cluster clients dial kubernetes.default.svc on 443.
        - port: 443
          protocol: TCP
    # Object storage for artifacts and the audit ledger. Narrow this to the
    # storage service's address range at install time.
    - ports:
        - port: 9000
          protocol: TCP
