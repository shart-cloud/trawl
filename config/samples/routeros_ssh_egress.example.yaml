# Opt-in egress for an SSH-managed switch. Replace this documentation address
# with the switch management IP before applying; keep it outside the default
# networkpolicy kustomization so installations without SSH mirrors stay closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-manager-routeros-ssh
  namespace: trawl-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trawl
      app.kubernetes.io/component: controller-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - port: 22
          protocol: TCP
