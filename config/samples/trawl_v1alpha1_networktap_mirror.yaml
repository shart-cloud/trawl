# A physical mirror tap: the SPAN port case.
#
# The node selector must resolve to exactly one node — the machine wired to the
# switch's mirror port. A selector matching several is rejected rather than
# guessed at, because only one of them can actually see the traffic.
apiVersion: trawl.cloud/v1alpha1
kind: NetworkTap
metadata:
  name: north-south-mirror
  namespace: trawl-system
spec:
  mode: Passive
  type: MirrorInterface
  mirrorInterface:
    interface: enp5s0
    # Defaulted on for mirror sources: the port carries frames addressed to
    # other hosts, and without promiscuous mode the NIC drops all of them.
    promiscuous: true
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: talos-sensor-01
  analyzers:
    suricata:
      enabled: true
      # Sized for the full Emerging Threats open ruleset, which is what
      # content.suricataFeedURL points at by default: roughly 45MB of rules and
      # tens of thousands of signatures, which Suricata expands well past a
      # gigabyte once compiled. At 1Gi it is OOMKilled during startup, before it
      # has inspected a single packet, and the tap reports a workload that will
      # not become ready without saying why. Lower this only alongside a
      # narrower ruleset.
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: "1", memory: 3Gi}
    zeek:
      enabled: true
      resources:
        requests: {cpu: 500m, memory: 512Mi}
        limits: {cpu: "1", memory: 1Gi}
