# An armed signature policy: capture the conversation an alert implicates.
#
# The filter template is the reason this is worth doing automatically rather
# than by hand. The placeholders are substituted from the alert that fired, so
# the capture holds the conversation the signature matched instead of everything
# on the interface for the next thirty seconds. The placeholder set is closed
# and each value is parsed as the type it claims to be, because the values
# describe traffic an attacker sends and the result becomes the expression the
# capture runner executes.
#
# armed: true is deliberate here, and deliberately not the default. Creating a
# policy is never the same act as switching it on - an operator writing a
# trigger for the first time gets to read it back before it can start collecting
# packets. Arming is recorded in the audit ledger as its own action.
apiVersion: trawl.cloud/v1alpha1
kind: CapturePolicy
metadata:
  name: high-severity-alerts
  namespace: trawl-system
spec:
  tapRef:
    name: node-eno1
  armed: true
  trigger:
    type: SuricataAlert
    suricataAlert:
      # Suricata's scale runs 1 (most severe) to 4, which is the reverse of
      # what most people assume. This is the top two.
      severities: [1, 2]
  capture:
    duration: 30s
    maxSize: 64Mi
    filterTemplate: "host {{source.ip}} and host {{destination.ip}}"
  retention: 7d
  rateLimit:
    # The only thing standing between a noisy signature and a capture storm
    # that fills the artifact bucket. The traffic decides how often this fires,
    # and the traffic is not under the operator's control.
    maxCapturesPerHour: 10
    # Equivalent traffic inside this window collapses to one capture. It shapes
    # the deduplication bucket rather than gating the policy as a whole, so two
    # unrelated conversations matching the same signature are not held back by
    # each other.
    cooldown: 5m
