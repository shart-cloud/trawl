apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Admission enforces the namespace and source rules a NetworkTap must satisfy.
# It fails closed: failurePolicy is Fail in manifests.yaml, so a webhook outage
# rejects new taps rather than admitting unvalidated ones.
resources:
  - manifests.yaml
  - service.yaml
