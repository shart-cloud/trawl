name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      analyzers:
        description: "Also build the analyzer images (Zeek and Suricata compile from source and take ~40 minutes)"
        type: boolean
        default: true

permissions: {}

env:
  REGISTRY: ghcr.io
  # One repository per image, under the project's namespace.
  NAMESPACE: shart-cloud/trawl
  GOTOOLCHAIN: auto

jobs:
  # Everything downstream needs the same version string and the same verified
  # checksums. Deriving them once means an analyzer image and a binary image
  # from one commit cannot disagree about which build they are.
  meta:
    name: Build metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      zeek_sha256: ${{ steps.locks.outputs.zeek_sha256 }}
      suricata_sha256: ${{ steps.locks.outputs.suricata_sha256 }}
      base_image: ${{ steps.locks.outputs.base_image }}
      rust_builder_image: ${{ steps.locks.outputs.rust_builder_image }}
      wireshark_version: ${{ steps.locks.outputs.wireshark_version }}
      wireshark_common_sha256: ${{ steps.locks.outputs.wireshark_common_sha256 }}
      libwsutil14_sha256: ${{ steps.locks.outputs.libwsutil14_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Derive version and commit
        id: version
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short HEAD)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            # Never a mutable tag: telemetry.NewBuildInfo rejects one at
            # startup, because "which version is running" must have an answer
            # that stays true.
            version="v0.0.0-dev.${commit}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Building ${version} (${commit})"

      - name: Read verified checksums from the lockfiles
        id: locks
        run: |
          set -euo pipefail
          # The lockfiles are the record of what was verified against an
          # upstream signature. Reading them here, rather than restating the
          # digests in this workflow, keeps one source of truth: a checksum
          # updated in only one of two places would build something nobody
          # reviewed.
          zeek="$(awk '/^zeek:/{f=1} f&&/^  sha256:/{print $2; exit}' images/zeek/SOURCES.lock)"
          suricata="$(awk '/^suricata:/{f=1} f&&/^  sha256:/{print $2; exit}' images/suricata/SOURCES.lock)"
          base="$(awk '/^base_image:/{f=1} f&&/^  digest:/{print $2; exit}' images/zeek/SOURCES.lock)"
          base_ref="$(awk '/^base_image:/{f=1} f&&/^  reference:/{print $2; exit}' images/zeek/SOURCES.lock)"

          for pair in "zeek:$zeek" "suricata:$suricata" "base:$base"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::${name} checksum is empty in SOURCES.lock; the build fails closed rather than fetching an unverified source"
              exit 1
            fi
          done

          echo "zeek_sha256=${zeek}" >> "$GITHUB_OUTPUT"
          echo "suricata_sha256=${suricata}" >> "$GITHUB_OUTPUT"
          echo "base_image=${base_ref%:*}@${base}" >> "$GITHUB_OUTPUT"

          rust_ref="$(awk '/^builder_image:/{f=1} f&&/^  reference:/{print $2; exit}' images/suricata/SOURCES.lock)"
          rust_digest="$(awk '/^builder_image:/{f=1} f&&/^  digest:/{print $2; exit}' images/suricata/SOURCES.lock)"
          echo "rust_builder_image=${rust_ref%:*}@${rust_digest}" >> "$GITHUB_OUTPUT"

          # The capture runner's dumpcap comes from pinned Debian packages.
          lock=images/capture-runner/SOURCES.lock
          ws_version="$(awk '/^wireshark:/{f=1} f&&/^  version:/{print $2; exit}' "$lock")"
          ws_common="$(awk '/^    wireshark-common:/{f=1} f&&/^      sha256:/{print $2; exit}' "$lock")"
          ws_util="$(awk '/^    libwsutil14:/{f=1} f&&/^      sha256:/{print $2; exit}' "$lock")"
          for pair in "wireshark_version:$ws_version" "wireshark-common:$ws_common" "libwsutil14:$ws_util"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::${name} is empty in ${lock}; the build fails closed rather than fetching an unverified package"
              exit 1
            fi
          done
          echo "wireshark_version=${ws_version}" >> "$GITHUB_OUTPUT"
          echo "wireshark_common_sha256=${ws_common}" >> "$GITHUB_OUTPUT"
          echo "libwsutil14_sha256=${ws_util}" >> "$GITHUB_OUTPUT"

  # The Go service binaries. They come from the shared Dockerfile and differ
  # only by which cmd/ package is built, so they fan out.
  binaries:
    name: ${{ matrix.binary }}
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        binary: [controller-manager, sensor-agent, event-worker, capture-reporter, artifact-gateway]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            BINARY=${{ matrix.binary }}
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ needs.meta.outputs.commit }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.binary }}:${{ needs.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.binary }}:${{ needs.meta.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,scope=${{ matrix.binary }},mode=max

  # content-init is deliberately not in the matrix above. It is not a plain Go
  # image: the resolver binary has to sit inside an Alpine carrying
  # suricata-update, git and oras, because it fetches detection content rather
  # than serving traffic. A distroless build of the same package would push
  # under the same name and produce an init container that cannot resolve
  # anything.
  content-init-image:
    name: content-init
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the content resolver binary
        run: |
          set -euo pipefail
          docker build --build-arg BINARY=content-init \
            --build-arg VERSION="${{ needs.meta.outputs.version }}" \
            --build-arg COMMIT="${{ needs.meta.outputs.commit }}" \
            --target builder -t trawl-content-builder .
          container="$(docker create trawl-content-builder)"
          docker cp "${container}:/workspace/trawl-binary" images/content-init/trawl-content
          docker rm "${container}"

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: images/content-init
          file: images/content-init/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/content-init:${{ needs.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/content-init:${{ needs.meta.outputs.commit }}

  # The capture runner needs dumpcap beside the Go binary, so like content-init
  # it takes the binary from the shared builder stage and finishes in its own
  # Containerfile.
  capture-runner-image:
    name: capture-runner
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the capture runner binary
        run: |
          set -euo pipefail
          docker build --build-arg BINARY=capture-runner \
            --build-arg VERSION="${{ needs.meta.outputs.version }}" \
            --build-arg COMMIT="${{ needs.meta.outputs.commit }}" \
            --target builder -t trawl-capture-builder .
          container="$(docker create trawl-capture-builder)"
          docker cp "${container}:/workspace/trawl-binary" images/capture-runner/trawl-capture-runner
          docker rm "${container}"

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: images/capture-runner
          file: images/capture-runner/Containerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.meta.outputs.base_image }}
            WIRESHARK_VERSION=${{ needs.meta.outputs.wireshark_version }}
            WIRESHARK_COMMON_SHA256=${{ needs.meta.outputs.wireshark_common_sha256 }}
            LIBWSUTIL14_SHA256=${{ needs.meta.outputs.libwsutil14_sha256 }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/capture-runner:${{ needs.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/capture-runner:${{ needs.meta.outputs.commit }}


  # The provenance document for this build. It runs after the digests exist, so
  # the manifest records the digests the installer will actually pin rather than
  # the ones currently written into config/.
  supply-chain:
    name: Supply-chain manifest
    runs-on: ubuntu-latest
    # Depends on `digests` rather than on `binaries`: it downloads the
    # image-digests artifact, and `digests` is what publishes it. Needing only
    # the builds would race the artifact into existence and fail intermittently.
    needs: [meta, digests]
    # `digests` itself runs under always(), so it completes even when the
    # analyzers were skipped. Mirror that, or a workflow_dispatch with analyzers
    # off produces every image and no provenance document for them.
    if: always() && needs.digests.result == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install pinned tools
        run: hack/verify-tools.sh --install

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-digests
          path: ${{ runner.temp }}/trawl-image-digests

      - name: Create the supply-chain output directory
        run: mkdir -p dist/supply-chain

      - uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        id: syft

      - name: Export the committed source tree
        run: |
          mkdir -p "${{ runner.temp }}/trawl-source"
          git archive HEAD | tar -x -C "${{ runner.temp }}/trawl-source"

      - name: Generate source and image SBOMs
        env:
          DIGESTS_FILE: ${{ runner.temp }}/trawl-image-digests/digests.txt
          OUT_DIR: ${{ runner.temp }}/trawl-supply-chain
          SOURCE_DIR: ${{ runner.temp }}/trawl-source
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: hack/generate-sboms.sh

      - name: Assemble the manifest
        env:
          DIGESTS_FILE: ${{ runner.temp }}/trawl-image-digests/digests.txt
          OUT_DIR: ${{ runner.temp }}/trawl-supply-chain
        run: hack/supply-chain-manifest.sh

      - name: Refuse an incomplete supply-chain record
        env:
          MANIFEST: ${{ runner.temp }}/trawl-supply-chain/manifest.json
        run: |
          jq -e '
            .build.cleanTree == true and
            .imageDigests.status == "present" and
            .goVulnerabilities.status == "present" and
            .sbom.status == "present" and
            .provenance.status == "present"
          ' "$MANIFEST" >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-manifest
          path: ${{ runner.temp }}/trawl-supply-chain/
          if-no-files-found: error

  # Zeek and Suricata are compiled from verified upstream source, so these are
  # the slow jobs. They are separated from the binaries so a Go change does not
  # wait forty minutes on an analyzer that did not change.
  analyzers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: meta
    if: github.event_name != 'workflow_dispatch' || inputs.analyzers
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zeek
            context: images/zeek
            sha_arg: ZEEK_SHA256
          - name: suricata
            context: images/suricata
            sha_arg: SURICATA_SHA256
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select the verified checksum
        id: sha
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "zeek" ]; then
            echo "value=${{ needs.meta.outputs.zeek_sha256 }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ needs.meta.outputs.suricata_sha256 }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Containerfile
          push: true
          build-args: |
            ${{ matrix.sha_arg }}=${{ steps.sha.outputs.value }}
            BASE_IMAGE=${{ needs.meta.outputs.base_image }}
            RUST_BUILDER_IMAGE=${{ needs.meta.outputs.rust_builder_image }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.name }}:${{ needs.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.name }}:${{ needs.meta.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Trawl's config references images by digest, so the digests have to be
  # readable somewhere other than the build log.
  digests:
    name: Record image digests
    runs-on: ubuntu-latest
    needs: [meta, binaries, content-init-image, capture-runner-image, analyzers]
    if: always() && needs.binaries.result == 'success' && needs.capture-runner-image.result == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve digests
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          : > digests.txt
          missing=0
          for image in controller-manager sensor-agent event-worker capture-runner \
                       capture-reporter artifact-gateway content-init zeek suricata; do
            ref="${REGISTRY}/${NAMESPACE}/${image}:${version}"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" || digest=""
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "${image}=${REGISTRY}/${NAMESPACE}/${image}@${digest}" | tee -a digests.txt
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
                 [ "${{ inputs.analyzers }}" != "true" ] && \
                 { [ "$image" = "zeek" ] || [ "$image" = "suricata" ]; }; then
              echo "${image}=<not built in this run>" | tee -a digests.txt
            else
              echo "::error::${ref} was required but its digest did not resolve"
              missing=1
            fi
          done
          {
            echo '### Image digests'
            echo
            echo '```'
            cat digests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$missing"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digests
          path: digests.txt
