name: Security

# Release-blocking scanning (T129).
#
# Every job here is required rather than advisory. A scan whose failure nobody
# has to act on trains people to ignore its colour, and this project's whole
# argument is that a silent failure is the expensive kind.
#
# The suppression list is what makes "required" survivable: a finding that
# cannot be fixed today is recorded in security/suppressions.yaml with a reason,
# a reviewer and a date it stops being accepted. The expiry is enforced, so a
# suppression cannot quietly become permanent.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # Vulnerability databases change without the code changing, so a build that
  # passed last week can be genuinely unsafe today. This is the only way that
  # gets noticed before a release rather than during one.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

env:
  GOTOOLCHAIN: auto

jobs:
  suppressions:
    name: Suppression review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # First, so an expired suppression is reported even when a scanner below
      # is failing for its own reasons. It is also the cheapest job here, and
      # the one whose failure has a deadline somebody already agreed to.
      - name: Verify no suppression has expired
        run: hack/verify-suppressions.sh

  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # The pinned version from hack/tools.mk, installed the same way every
      # other tool is. govulncheck was pinned and version-verified in this
      # repository for months without anything ever running it.
      - name: Install pinned tools
        run: hack/verify-tools.sh --install

      # Symbol-level: it reports only vulnerabilities in code paths the build
      # actually reaches, so a finding here is a call this binary can make
      # rather than a package it happens to link.
      - name: Scan
        run: bin/govulncheck ./...

  images:
    name: Container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        binary: [controller-manager, sensor-agent, event-worker, capture-reporter, artifact-gateway]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Built here rather than pulled by tag: the tag on a registry can be
      # repointed after the review that approved it, and scanning something
      # other than what this commit produces answers a question nobody asked.
      - name: Build the image for this commit
        run: |
          set -euo pipefail
          docker build \
            --build-arg BINARY=${{ matrix.binary }} \
            --build-arg VERSION=v0.0.0-scan \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            -t "trawl-scan/${{ matrix.binary }}:scan" .

      # Derived from security/suppressions.yaml rather than maintained beside
      # it, so a Trivy suppression is covered by the same expiry enforcement as
      # every other kind and cannot outlive its review by living somewhere the
      # checker never reads.
      - name: Render the ignore list from the reviewed suppressions
        run: hack/verify-suppressions.sh --emit-trivyignore > security/.trivyignore

      # The Trivy binary, pinned and checksum-verified, rather than
      # trivy-action. The action's install script fetches the release through
      # the GitHub API at job time and exited 1 on the first run of this
      # workflow having found the version it wanted - an environmental failure
      # in a tool whose whole job is to tell us about environmental problems.
      #
      # Pinning it the way hack/tools.mk pins everything else removes that
      # class: no API call, no version resolution, and a checksum that says the
      # bytes are the ones somebody reviewed.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$url" -o trivy.tar.gz
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          ./trivy --version

      - name: Scan
        run: |
          set -euo pipefail
          ./trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile security/.trivyignore \
            --exit-code 1 \
            --format table \
            "trawl-scan/${{ matrix.binary }}:scan"

  manifests:
    name: Manifest privilege
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Two layers on purpose. The shell script greps the source manifests;
      # the contract tests render config/default and assert properties that
      # only exist after kustomization - which is where an event worker once
      # shipped naming a service account that does not exist.
      - name: Static privilege checks
        run: make manifest-security

      - name: Rendered-manifest security contract
        run: |
          make kustomize
          go test ./test/contract/ -run 'Security|Manifest|Webhook|ServiceAccount|Capability|Bucket'

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # osv-scanner rather than dependency-review-action. The latter needs the
      # repository's dependency graph enabled and fails outright without it -
      # a gate that depends on a settings toggle somebody has to remember is a
      # gate that is off by default.
      #
      # It also complements govulncheck rather than duplicating it. govulncheck
      # is reachability-based and reports only what this build can actually
      # call, which is the right bar for deciding whether to act. This reports
      # every known advisory against a pinned dependency, reachable or not,
      # which is the right bar for deciding whether to *upgrade* - and it is
      # the one that notices a newly added dependency arriving with a known
      # problem.
      # Pinned binary rather than the action, for the reason the Trivy step
      # above gives: every third-party scanning action tried on the first run of
      # this workflow failed for an environmental reason rather than a finding.
      #
      # On the checksum's strength, stated plainly because this repository
      # distinguishes them elsewhere (images/*/SOURCES.lock): osv-scanner
      # publishes no checksums file, so this digest was recorded from a
      # download rather than verified against an upstream signature. It pins the
      # artifact so it cannot change underneath us, which is what stops a
      # re-cut release altering the gate; it is not evidence of who published
      # it. Upgrade to a signature check if upstream starts publishing one.
      - name: Install osv-scanner
        env:
          OSV_VERSION: 2.5.1
          OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --version

      - name: Scan the module dependencies
        run: ./osv-scanner scan source --lockfile=go.mod

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Whole history: a credential removed in a later commit is still
          # readable in the one that added it, and is still a credential that
          # needs rotating. Scanning only the tip finds nothing and says so
          # confidently.
          fetch-depth: 0

      # The gitleaks *binary*, not gitleaks-action. The action refuses to run
      # for a GitHub organization without a paid licence key - it exits before
      # scanning anything, so the job fails without ever having looked. The
      # scanner itself is MIT-licensed and has no such restriction.
      #
      # Pinned by version and checksum for the same reason every other upstream
      # source in this repository is: a release tag can be re-cut, and a secret
      # scanner fetched over an unverified path is a poor thing to trust.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the whole history
        run: ./gitleaks git . --config security/gitleaks.toml --redact --verbose --exit-code 1
