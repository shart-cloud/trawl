name: Docs

# Publishes the Starlight site to Cloudflare Workers as a static-assets Worker.
#
# The build gate lives in the CI workflow's `docs` job and runs on every pull
# request. This workflow only ships what main already proved buildable, so a
# failure here is a deployment problem rather than a content problem — which
# makes it worth waking somebody for.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Docs get republished for reasons unrelated to a commit: a rolled-back
  # deployment, a rotated token, a domain change.
  workflow_dispatch:

permissions: {}

# A second push while the first is publishing would race two `wrangler deploy`
# calls onto the same Worker, and the winner is whichever finishes last rather
# than whichever is newer.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://trawl.cloud
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      # Rebuilt here rather than carried from the CI run as an artifact: the
      # same argument the security workflow makes about scanning images it
      # builds itself. What ships should be what this commit produces.
      - name: Build
        working-directory: docs
        run: npm run build

      # The pinned wrangler from docs/package.json, not an action that resolves
      # a version at job time. Same reasoning as the pinned Trivy binary in the
      # security workflow.
      - name: Deploy
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
