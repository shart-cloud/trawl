version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - noctx
    - errname
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
        # Import boundaries (plan.md "Project Structure"). The pure domain
        # packages must stay free of orchestration so their logic is testable
        # without a cluster, and so a policy or capture decision cannot acquire
        # a hidden dependency on live cluster state.
        pure-domain-no-kube-client:
          list-mode: lax
          files:
            - "**/internal/policy/**"
            - "**/internal/observation/**"
            - "**/internal/capture/bounds.go"
            - "**/internal/capture/filter.go"
            - "**/internal/capture/manifest.go"
            - "**/internal/capture/state.go"
          deny:
            - pkg: sigs.k8s.io/controller-runtime
              desc: "pure domain logic must not depend on controller-runtime; keep reconciliation in internal/controller"
            - pkg: k8s.io/client-go
              desc: "pure domain logic must not talk to the API server; pass resolved values in"
        # The capture runner is the one privileged data-plane binary. It is
        # mounted with no Kubernetes API credentials (T081), so an accidental
        # client import would be a privilege escalation, not just a layering slip.
        capture-runner-no-kube-api:
          list-mode: lax
          files:
            - "**/cmd/capture-runner/**"
          deny:
            - pkg: k8s.io/client-go
              desc: "capture runner runs without an API token; status writes go through the reporter sidecar"
            - pkg: sigs.k8s.io/controller-runtime
              desc: "capture runner is not a controller"
        # Constitution III: packet payloads, credentials, and tokens must never
        # reach logs. Ban the loggers that bypass the structured, sanitized path.
        no-unstructured-logging:
          list-mode: lax
          files:
            - "**/internal/**"
            - "**/cmd/**"
          deny:
            - pkg: log
              desc: "use the structured logger from internal/telemetry; plain log bypasses sanitization"
            - pkg: github.com/sirupsen/logrus
              desc: "use the structured logger from internal/telemetry"
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
        - newexpr
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Scaffolded e2e helpers shell out to kubectl with test-controlled
      # arguments. gosec/noctx stay enabled everywhere that ships in an image.
      - linters:
          - gosec
          - noctx
        path: test/utils/
    paths:
      - third_party$
      - builtin$
      - examples$
      - tools.go$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
